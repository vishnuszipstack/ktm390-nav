name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Becomes the app's versionCode and the release tag (build-N) the in-app updater compares against.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    # 24.04 ships the Android SDK preinstalled at $ANDROID_HOME.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log

      - name: Report compiler errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: ktm390-nav
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk ktm390-nav.apk
          gh release create "$TAG" ktm390-nav.apk \
            --title "KTM Nav build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B | head -1)" \
            --latest

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
